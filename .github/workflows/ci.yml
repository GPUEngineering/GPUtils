name: Continuous integration

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: A40 CUDA and Python tests
    runs-on: [self-hosted, linux, x64, a40]
    timeout-minutes: 20

    env:
      JOBS: "4"
      SANITIZER_REPEATS: "3"
      COMPUTE_SANITIZER: /usr/local/cuda/bin/compute-sanitizer

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check CUDA
        run: |
          nvidia-smi
          /usr/local/cuda/bin/nvcc --version
          /usr/local/cuda/bin/compute-sanitizer --version

      - name: Prepare Python environment
        run: |
          python3 -m venv build/test-venv
          build/test-venv/bin/python -m pip install --upgrade pip
          build/test-venv/bin/python -m pip install ./python pytest

      - name: Unit tests and satanization
        run: |
          bash scripts/check_memory.sh -DSM_ARCH=86 -DCPPVERSION=20

      - name: Run Python tests with pytest
        run: bash scripts/run_python_tests.sh

      - name: Save diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a40-test-logs
          path: |
            build/test/Testing/Temporary/
            build/sanitizer/
          if-no-files-found: ignore
